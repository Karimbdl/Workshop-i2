# Broker MQTT du back-office (pilotage de la LED de l'ESP8266).
# Écoute sur le réseau pour que l'ESP (sur le point d'accès) et le face-agent
# (sur le PC Hôte) puissent publier/s'abonner.

listener 1883 0.0.0.0
# Démo : accès anonyme. À sécuriser ensuite (identifiant/mot de passe MQTT).
allow_anonymous true

persistence false
log_dest stdout
log_type warning
