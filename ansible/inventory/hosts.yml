# Inventaire RESILIENCE-ALPHA.
#
# « hote » = le PC Hôte qui fait tourner la plateforme. Le poste de pilotage
# Ansible est un conteneur sur ce même PC : il parle au moteur Docker par le
# socket, d'où la connexion locale.
#
# Pour déployer sur un serveur Linux distant à la place, ajouter une machine au
# groupe avec ansible_connection: ssh (le dépôt doit être présent sur le serveur
# au chemin indiqué par ra_root).
all:
  children:
    hote:
      hosts:
        pc-hote:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
