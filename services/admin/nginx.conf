server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
