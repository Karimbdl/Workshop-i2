# Collecte des métriques toutes les 15 s. Toutes les cibles sont sur des réseaux Docker internes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: devolut

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["auth-service:8000"]
        labels: { service: auth-service }
      - targets: ["payment-api:8000"]
        labels: { service: payment-api }
      - targets: ["ledger-service:8000"]
        labels: { service: ledger-service }

  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: { service: gateway }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { service: redis }

  # Alloy expose aussi les compteurs calculés à partir des journaux (passerelle, WAF, connexions).
  - job_name: ml-detector
    static_configs:
      - targets: ["ml-detector:8000"]
        labels: { service: ml-detector }

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels: { service: alloy }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { service: loki }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { service: prometheus }
